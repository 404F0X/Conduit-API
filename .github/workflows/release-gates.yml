name: Release gates

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: conduit_test
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit -d conduit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CONDUIT_POSTGRES_PASSWORD: conduit-ci-only-password
      CONDUIT_DB_DIALECT: postgres
      CONDUIT_DB_DSN: postgresql://conduit:conduit-ci-only-password@127.0.0.1:5432/conduit_test
      CONDUIT_TEST_POSTGRES_DSN: postgresql://conduit:conduit-ci-only-password@127.0.0.1:5432/conduit_test
      CONDUIT_E2E_POSTGRES_DSN: postgresql://conduit:conduit-ci-only-password@127.0.0.1:5432/conduit_e2e_ci
      CONDUIT_E2E_BACKEND_TIMEOUT_MS: "600000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          cache-on-failure: true

      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.23.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: pnpm audit --prod --audit-level high

      - name: Check frontend formatting
        working-directory: frontend
        run: pnpm format:check

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test:unit

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Verify frontend legal notices
        working-directory: frontend
        shell: bash
        run: |
          test -r dist/licenses/LICENSE
          test -r dist/licenses/NOTICE
          test -r dist/licenses/LICENSING.md
          test -r dist/licenses/LICENSES/LGPL-3.0-only.txt
          test -r dist/licenses/frontend/NOTICE
          test -s dist/licenses/frontend/THIRD_PARTY_LICENSES.md
          grep --fixed-strings --quiet '## react - ' dist/licenses/frontend/THIRD_PARTY_LICENSES.md
          grep --fixed-strings --quiet '## @lobehub/icons - ' dist/licenses/frontend/THIRD_PARTY_LICENSES.md
          ! grep --fixed-strings --quiet '@splinetool/runtime' dist/licenses/frontend/THIRD_PARTY_LICENSES.md
          ! grep --fixed-strings --quiet '@splinetool/runtime' pnpm-lock.yaml

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Check configuration schema drift
        run: bash scripts/generate_config_schema.sh --check

      - name: Check Rust security invariants
        run: node scripts/rust/security-static-check.mjs && node scripts/rust/security-static-check.mjs --self-test

      - name: Test Rust workspace
        run: cargo test --locked --workspace --all-targets

      - name: Check PostgreSQL production binary
        run: cargo check --locked -p conduit-bin

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets

      - name: Install Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated browser E2E
        working-directory: frontend
        run: pnpm test:e2e -- --reporter=line

      - name: Validate Compose model
        run: docker compose -f compose.yml config --quiet

  container-smoke:
    runs-on: ubuntu-latest
    needs: test-and-build
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: conduit-ci
      CONDUIT_HTTP_PORT: "18090"
      CONDUIT_COMMIT: ${{ github.sha }}
      CONDUIT_BRANCH: ${{ github.ref_name }}
      CONDUIT_POSTGRES_PASSWORD: conduit-ci-only-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and start release image
        run: docker compose -f compose.yml up --build --detach

      - name: Wait for healthy service
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18090/health >/dev/null &&
               curl --fail --silent --show-error http://127.0.0.1:18090/admin/system/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yml ps
          docker compose -f compose.yml logs conduit-api
          exit 1

      - name: Verify PostgreSQL schema persistence
        shell: bash
        run: |
          migration_count="$(docker compose -f compose.yml exec --no-TTY postgres \
            psql --username conduit --dbname conduit --tuples-only --no-align \
            --command 'SELECT COUNT(*) FROM schema_migrations')"
          test "${migration_count}" -gt 0

      - name: Verify image build identity
        shell: bash
        run: |
          build_info="$(docker compose -f compose.yml exec --no-TTY conduit-api /app/conduit-api build-info)"
          printf '%s\n' "$build_info"
          grep --fixed-strings "commit: $CONDUIT_COMMIT" <<<"$build_info"
          grep --fixed-strings "branch: $CONDUIT_BRANCH" <<<"$build_info"

      - name: Verify runtime identity and legal notices
        shell: bash
        run: |
          test "$(docker compose -f compose.yml exec --no-TTY conduit-api id -u)" = "10001"
          docker compose -f compose.yml exec --no-TTY conduit-api test -r /app/licenses/LICENSE
          docker compose -f compose.yml exec --no-TTY conduit-api test -r /app/licenses/NOTICE
          docker compose -f compose.yml exec --no-TTY conduit-api test -r /app/licenses/LICENSING.md
          docker compose -f compose.yml exec --no-TTY conduit-api test -r /app/licenses/LICENSES/LGPL-3.0-only.txt
          docker compose -f compose.yml exec --no-TTY conduit-api test -r /app/licenses/frontend/NOTICE
          docker compose -f compose.yml exec --no-TTY conduit-api test -s /app/licenses/frontend/THIRD_PARTY_LICENSES.md

      - name: Verify restart health
        shell: bash
        run: |
          docker compose -f compose.yml restart conduit-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18090/health >/dev/null &&
               curl --fail --silent --show-error http://127.0.0.1:18090/admin/system/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.yml logs conduit-api
          exit 1

      - name: Verify PostgreSQL data survived restart
        shell: bash
        run: |
          migration_count="$(docker compose -f compose.yml exec --no-TTY postgres \
            psql --username conduit --dbname conduit --tuples-only --no-align \
            --command 'SELECT COUNT(*) FROM schema_migrations')"
          test "${migration_count}" -gt 0

      - name: Show container logs
        if: always()
        run: docker compose -f compose.yml logs conduit-api

      - name: Remove isolated CI deployment
        if: always()
        run: docker compose -f compose.yml down --volumes --remove-orphans
