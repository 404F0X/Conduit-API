[package]
name = "conduit-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
redis = []
otel = []
# Embed the frontend dist into the binary for production builds. When enabled,
# static assets are served from `include_dir!` (S04); otherwise they are read
# from disk under `frontend/dist` (S08 dev strategy).
embed-frontend = ["dep:include_dir"]
full = ["redis", "otel"]

[dependencies]
async-graphql = { workspace = true }
async-graphql-axum = { workspace = true }
async-trait = { workspace = true }
conduit-admin-graphql = { workspace = true }
conduit-auth = { workspace = true }
conduit-config = { workspace = true }
conduit-core = { workspace = true }
conduit-llm = { workspace = true }
conduit-openapi-graphql = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
futures-core = { workspace = true }
include_dir = { version = "0.7", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
